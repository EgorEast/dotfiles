# Check the following link for mpv's default keybindings:
# https://github.com/mpv-player/mpv/blob/master/etc/input.conf

# ==========    CUSTOM KEYBINDINGS    ==========

# --- Навигация по треку (cmus style + стрелки)
h seek -5                      # перемотка назад на 5 сек
l seek 5                       # перемотка вперед на 5 сек
H seek -60                     # перемотка назад на 1 мин
L seek 60                      # перемотка вперед на 1 мин
LEFT seek -5                   # стрелка влево: назад 5 сек (как в cmus)
RIGHT seek 5                   # стрелка вправо: вперед 5 сек
Shift+LEFT seek -60            # стрелка влево+Shift: назад на 1 мин
Shift+RIGHT seek 60            # стрелка вправо+Shift: вперед на 1 мин

# --- Переключение треков
n playlist-next                # n — следующий трек
p playlist-prev                # p — предыдущий трек

# --- Воспроизведение / пауза / стоп
c cycle pause                  # c — пауза / продолжить
v stop                         # v — стоп
q quit                         # q — выйти из mpv
Q quit-watch-later             # Q — выйти и запомнить позицию

# --- Громкость (все варианты клавиш)
+ add volume 5                 # + громче
= add volume 5                 # = тоже громче (Shift+= → +)
KP_ADD add volume 5            # NumPad +

- add volume -5                # - тише
KP_SUBTRACT add volume -5      # NumPad -

[ add volume -1                # [ тихо (мелкая регулировка)
] add volume +1                # ] громко (мелкая регулировка)

WHEEL_UP add volume 2          # колесо вверх = громче
WHEEL_DOWN add volume -2       # колесо вниз = тише
UP add volume 2                # стрелка вверх = громче
DOWN add volume -2              # стрелка вниз = тише

# --- Перемотка по треку (позиционирование)
0 seek 0 absolute              # 0 — в начало трека
$ seek 100 absolute-percent    # $ — в конец трека

# --- Аудио
a cycle audio                  # a — следующая аудиодорожка
A cycle audio down             # A — предыдущая аудиодорожка
x add audio-delay -0.05        # x — сдвиг аудио назад на 50 мс
X add audio-delay +0.05        # X — сдвиг аудио вперед на 50 мс

# --- Субтитры
s cycle sub                    # s — переключение субтитров
S cycle sub down               # S — назад по субтитрам
Shift+g add sub-scale +0.05    # увеличить размер субтитров
Shift+f add sub-scale -0.05    # уменьшить размер субтитров
E add sub-gauss +0.1           # фильтр сглаживания субтитров (больше) https://mpv.io/manual/stable/#options-sub-gauss
R add sub-gauss -0.1           # фильтр сглаживания субтитров (меньше)
z add sub-delay -0.05          # субтитры раньше на 50 мс
Z add sub-delay +0.05          # субтитры позже на 50 мс
u cycle sub-gray               # черно-белые субтитры https://mpv.io/manual/stable/#options-sub-gray
U cycle blend-subtitles        # смешивание субтитров с картинкой https://mpv.io/manual/stable/#options-blend-subtitles
p cycle sub-fix-timing         # фиксинг таймингов субтитров https://mpv.io/manual/stable/#options-sub-fix-timing
g sub-reload                   # перезагрузить субтитры https://mpv.io/manual/stable/#command-interface-sub-reload
l cycle-values sub-ass-override "yes" "force" "no"  # режим отображения ASS https://mpv.io/manual/stable/#options-sub-ass-override

# --- Видео
d cycle deband                 # включить/выключить debanding
D cycle deinterlace            # включить/выключить deinterlace
N cycle video-unscaled         # включить/выключить unscaled
C cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1" # смена соотношения сторон https://mpv.io/manual/stable/#options-sub-ass-override

# _ cycle-values video 1 no
_ ignore

# --- Скрипты
~ script-message cycle-commands "apply-profile HDR ; show-text 'HDR profile applied'" "apply-profile HDR restore ; show-text 'HDR profile restored'"  # переключение HDR профилей
# ~ script-message cycle-commands "apply-profile Clip ; show-text 'Clip profile applied'" "apply-profile Mobius ; show-text 'Mobius profile applied'" "apply-profile Reinhard ; show-text 'Reinhard profile applied'" "apply-profile Hable ; show-text 'Hable profile applied'" "apply-profile bt.2390 ; show-text 'bt.2390 profile applied'" "apply-profile Gamma ; show-text 'Gamma profile applied'" "apply-profile Linear ; show-text 'Linear profile applied'"
V script-binding cycle-visualizer         # переключение аудио-визуализатора (audio-visualizer.lua)
b script-binding set_gif_start            # выставить начало GIF (mpv-gif.lua)
B script-binding set_gif_end              # выставить конец GIF (mpv-gif.lua)
ctrl+b script-binding make_gif            # создать GIF (mpv-gif.lua)
ctrl+B script-binding make_gif_with_subtitles  # создать GIF с субтитрами (doesn't seem to work) (mpv-gif.lua)
ctrl+c script-binding copy-time           # копировать текущий таймкод (copy-time.lua)
ctrl+S script-binding toggle-seeker       # включить режим поиска по таймкоду (seek-to.lua)
ctrl+v script-binding paste-timestamp     # перейти к таймкоду из буфера (seek-to.lua)
alt+b script-binding sponsorblock         # включить/выключить sponsorblock (sponsorblock-minimal.lua)

# --- Служебные
i script-binding stats/display-stats-toggle  # показать статистику
k cycle ontop                               # окно поверх всех
